<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- GitHub Pages เสิร์ฟไฟล์นี้แทนทุก path ที่หาไม่เจอ ไม่ว่าจะลึกแค่ไหน
     path แบบ ../ จึงใช้ไม่ได้ ต้องตรึงฐานไว้ด้วย <base>
     ถ้าเปลี่ยนชื่อ repo หรือย้ายไป custom domain ต้องแก้บรรทัดล่างนี้ -->
<base href="/khokret-travel-web/">

<title>ไม่เจอหน้านี้ — Kret Check</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#513229">

<link rel="icon" href="assets/logo/logo-small.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/main.css">

<script>
(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('kretcheck-theme');if(t)d.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <div class="nav__bar">
      <a class="nav__brand" href="index.html">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <circle cx="48" cy="48" r="44" fill="#F4F1E2"/>
          <path d="M22 58c4-17 15-24 26-24s22 7 26 24z" fill="#2D4A35"/>
          <path d="M45 34l3-10 3 10z" fill="#513229"/>
          <rect x="18" y="64" width="60" height="6" rx="3" fill="#513229"/>
          <rect x="30" y="75" width="36" height="6" rx="3" fill="#513229" opacity=".5"/>
        </svg>
        <span>
          <span class="nav__name">KRET CHECK!</span>
          <span class="nav__sub">เกาะเกร็ด · ชุมชนมอญ นนทบุรี</span>
        </span>
      </a>

      <button class="icon-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="สลับเป็นโหมดกลางคืน">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="oops">
    <!-- โลโก้เวอร์ชันเล็ก แต่เอาเส้นแม่น้ำมาเป็นตัวเล่า : เรือออกไปแล้ว -->
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <path d="M14 64c5-24 20-35 34-35s29 11 34 35z" fill="#2D4A35" opacity=".35"/>
      <path d="M44 29l4-14 4 14z" fill="#513229" opacity=".35"/>
      <rect x="8" y="72" width="80" height="8" rx="4" fill="#513229"/>
      <rect x="24" y="84" width="48" height="8" rx="4" fill="#513229" opacity=".55"/>
    </svg>

    <p class="oops__code">404 · ไม่เจอหน้านี้</p>
    <h1 class="oops__title">เรือออกไปแล้ว</h1>
    <p class="oops__text">
      หน้าที่กำลังหาอาจถูกย้าย เปลี่ยนชื่อ หรือยังไม่ได้ทำ
      กลับไปตั้งหลักที่หน้าแรกแล้วเริ่มใหม่ได้เลย
    </p>

    <div class="oops__cta">
      <a class="btn btn--green" href="index.html">กลับหน้าแรก</a>
      <a class="btn btn--ghost" href="docs/sitemap.html">ดูผังเว็บทั้งหมด</a>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <p class="footer__bar" style="margin-top: 0; border-top: 0; padding-top: 0">
      © 2569 Kret Check · เกาะเกร็ด ชุมชนมอญ นนทบุรี
    </p>
  </div>
</footer>

<script src="assets/js/main.js" defer></script>
</body>
</html>
